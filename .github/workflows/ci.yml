name: Validate ILOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  modern:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU runtime
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e './modern[test,api,learning]' PyYAML
      - name: Tests
        run: python -m pytest modern/tests huawei/tests/test_recovered_model.py -q
      - name: CBS demo
        run: ilos modern/examples/six_vehicles.json --output outputs/cbs.json --html outputs/cbs.html
      - name: Trained PPO demo
        run: ilos modern/examples/three_vehicles.json --backend ppo --model modern/checkpoints/port_ppo.zip --output outputs/ppo.json --html outputs/ppo.html
  mindspore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Huawei runtime
        run: python -m pip install -r huawei/requirements.txt pytest
      - name: Train and reload a small network
        run: python -m pytest huawei/tests/test_mindspore.py -q
