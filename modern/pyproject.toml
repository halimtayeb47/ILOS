[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilos-route-planner"
version = "0.2.0"
description = "Multi-vehicle logistics simulation with PPO learning and validated route planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
learning = ["stable-baselines3>=2.7,<3", "gymnasium>=1.0,<2", "torch>=2.6,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ilos = "ilos.cli:main"
ilos-train = "ilos.learning:train_main"
ilos-evaluate = "ilos.learning:evaluate_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ilos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
